<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Town — Sector A1</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div class="hud-frame tl"></div>
    <div class="hud-frame tr"></div>
    <div class="hud-frame bl"></div>
    <div class="hud-frame br"></div>
    <div id="sector-chip" class="hud-chip">SECTOR A1</div>
    <div id="map-chip" class="hud-chip">MAP : GLOBAL</div>
    <div id="tooltip" class="hud-chip tooltip"></div>
    <div id="robot-pov" class="robot-pov" hidden>
      <div class="robot-pov__label">ROBOT POV</div>
      <div id="robot-pov-name" class="robot-pov__name"></div>
      <button id="robot-pov-exit" class="btn" type="button">EXIT VIEW</button>
    </div>
    <aside id="robot-pov-minimap" class="robot-pov-minimap" aria-label="TOWN MINIMAP" hidden>
      <div class="robot-pov-minimap__head">
        <span class="robot-pov-minimap__title">LOCAL MAP</span>
        <span class="robot-pov-minimap__legend">▲ YOU</span>
      </div>
      <canvas id="robot-pov-minimap-canvas" width="180" height="180"></canvas>
    </aside>
    <aside id="robot-pov-plan" class="robot-pov-plan" aria-label="ROBOT VISIT PLAN" hidden>
      <div class="robot-pov-plan__head">
        <span class="robot-pov-plan__title">VISIT LOG</span>
        <span id="robot-pov-status" class="robot-pov-plan__status"></span>
      </div>
      <div class="robot-pov-plan__section">
        <div class="robot-pov-plan__caption">RECENT</div>
        <ol id="robot-pov-history" class="robot-pov-plan__list"></ol>
      </div>
      <div class="robot-pov-plan__section">
        <div class="robot-pov-plan__caption">UP NEXT</div>
        <ol id="robot-pov-upcoming" class="robot-pov-plan__list robot-pov-plan__list--upcoming"></ol>
      </div>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
